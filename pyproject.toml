[project]
name = "meeting-governance"
version = "0.1.0"
description = "Real-time meeting governance agent (MVP) — decides utterance-by-utterance what may be recorded."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
    "deepgram-sdk>=7.3.1",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
